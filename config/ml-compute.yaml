# ml-compute configuration
# Endpoints et constantes du cluster Ray

endpoints:
  core: "http://10.0.0.44:8050"
  vault: "http://10.0.0.44:8050/vault"
  nomad: "http://10.0.0.44:4646"
  ray_dashboard: "http://localhost:8265"
  ray_serve: "http://localhost:8000"
ray:
  dashboard_url: "http://localhost:8265"
  serve_url: "http://localhost:8000"
  gcs_port: 6380
  head_node: "10.0.0.44"

api:
  host: "0.0.0.0"
  port: 9469
  log_level: "info"

workers:
  onyxtensor:
    ip: "10.0.0.73"
    num_cpus: 2
    num_gpus: 3
    ram_gb: 8
    cpu_model: "Intel Celeron G5905"
    gpus:
      - type: "NVIDIA RTX 3080 10GB"
        pcie: "x16 Gen3"
        role: "training_primary"
      - type: "NVIDIA RTX 4060 8GB"
        pcie: "x1 Gen3 riser"
        role: "training_secondary"
      - type: "NVIDIA RTX 2060 SUPER 8GB"
        pcie: "x1 Gen3 riser"
        role: "training"
    comment: "Rig 1 — training dédié. Ajout RTX 4070S prévu (ex-Cortex)."
  onyxcortex:
    ip: "10.0.0.26"
    num_cpus: 16
    num_gpus: 1
    ram_gb: 46
    cpu_model: "Intel i7-10700KF"
    gpus:
      - type: "NVIDIA RTX 4070 SUPER 12GB"
        pcie: "x16 Gen3"
        role: "training + SAM/MedSAM2"
    comment: "Transitoire — GPU migre vers Tensor, remplacée par 5060 Ti ou 2060S."
  onyxsynth:
    ip: "10.0.0.78"
    num_cpus: 2
    num_gpus: 1
    ram_gb: 8
    gpus:
      - type: "NVIDIA RTX 3080 10GB"
        pcie: "x16 Gen3"
        device_id: 0
        role: "training"
    comment: "Rig 2 — GPU 0 uniquement (3080 isolée). GPU 1-6 réservées LLM (CUDA_VISIBLE_DEVICES=0 pour Ray)."
  # GPU 1-6 de Synth = LLM Qwen3-32B-Q8_0 (systemd llm-server) — JAMAIS dans Ray
  #
  # OnyxPoint (10.0.0.86) — GROBID dédié (T1000 8GB)
  # Glia (10.0.0.8) — hors service
  # Axon (10.0.0.21) — CPU only, non connecté Ray

models:
  base_dir: "/opt/onyx/skills/ml-compute/models"
  supported_types:
    - yolo
    - efficientnet
    - vllm
    - custom

serve:
  default_num_replicas: 1
  default_gpu_memory_utilization: 0.7
  http_timeout: 15.0

nomad:
  url: "http://10.0.0.44:4646"
  timeout: 30.0
