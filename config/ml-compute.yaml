# ml-compute configuration
# Endpoints et constantes du cluster Ray

ray:
  dashboard_url: "http://localhost:8265"
  serve_url: "http://localhost:8000"
  gcs_port: 6380
  head_node: "10.0.0.44"

api:
  host: "0.0.0.0"
  port: 9469
  log_level: "info"

workers:
  onyxpoint:
    ip: "10.0.0.86"
    num_cpus: 10
    num_gpus: 1
    ram_gb: 23
    cpu_model: "Intel i5-10400"
    gpu_type: "NVIDIA T1000 8GB"
  glia:
    ip: "10.0.0.8"
    num_cpus: 20
    ram_gb: 62
    cpu_model: "2x Intel Xeon E5-2630"
  axon:
    ip: "10.0.0.21"
    num_cpus: 4

models:
  base_dir: "/opt/onyx/skills/ml-compute/models"
  supported_types:
    - yolo
    - efficientnet
    - vllm
    - custom

serve:
  default_num_replicas: 1
  default_gpu_memory_utilization: 0.7
  http_timeout: 15.0

nomad:
  url: "http://10.0.0.44:4646"
  timeout: 30.0

sam:
  job_name: "sam-inference"
  endpoint_port: 9470
  host: "10.0.0.26"
  job_spec_path: "/opt/onyx/skills/ml-compute/jobs/sam/sam_job_spec.json"
