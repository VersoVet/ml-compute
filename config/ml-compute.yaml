# ml-compute configuration
# Endpoints et constantes du cluster Ray

endpoints:
  core: "http://10.0.0.44:8050"
  vault: "http://10.0.0.44:8050/vault"
  nomad: "http://10.0.0.44:4646"
  ray_dashboard: "http://localhost:8265"
  ray_serve: "http://localhost:8000"
  sam: "http://10.0.0.26:9470"

ray:
  dashboard_url: "http://localhost:8265"
  serve_url: "http://localhost:8000"
  gcs_port: 6380
  head_node: "10.0.0.44"

api:
  host: "0.0.0.0"
  port: 9469
  log_level: "info"

workers:
  onyxcortex:
    ip: "10.0.0.26"
    num_cpus: 16
    num_gpus: 1
    ram_gb: 46
    cpu_model: "Intel i7-10700KF"
    gpu_type: "NVIDIA RTX 4070 SUPER 12GB"
  # OnyxPoint (10.0.0.86) — RETIRÉ du cluster Ray
  # Machine dédiée GROBID exclusivement (GPU T1000 8GB, 28Go RAM, 10 CPUs)
  # NE PAS réajouter comme worker Ray — conflit de ressources GPU
  #
  # Glia (10.0.0.8) — RETIRÉE du cluster Ray (machine hors service)
  # Axon (10.0.0.21) — Non connecté au cluster Ray

models:
  base_dir: "/opt/onyx/skills/ml-compute/models"
  supported_types:
    - yolo
    - efficientnet
    - vllm
    - custom

serve:
  default_num_replicas: 1
  default_gpu_memory_utilization: 0.7
  http_timeout: 15.0

nomad:
  url: "http://10.0.0.44:4646"
  timeout: 30.0

sam:
  job_name: "sam-inference"
  endpoint_port: 9470
  host: "10.0.0.26"
  job_spec_path: "/opt/onyx/skills/ml-compute/jobs/sam/sam_job_spec.json"
