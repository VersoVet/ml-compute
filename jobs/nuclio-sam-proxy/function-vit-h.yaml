apiVersion: "nuclio.io/v1"
kind: "NuclioFunction"
metadata:
  name: "pth-sam-vit-h"
  namespace: "nuclio"
  labels:
    nuclio.io/project-name: "cvat"
  annotations:
    name: "SAM ViT-H"
    type: "interactor"
    framework: "pytorch"
    spec: ""
    min_pos_points: "0"
    min_neg_points: "0"
    startswith_box: "false"
    startswith_box_optional: "true"
    help_message: "Segment Anything ViT-H — meilleure qualité (GPU OnyxCortex RTX 4070)"
    version: "2"
spec:
  description: "SAM ViT-H segmentation proxy to OnyxCortex GPU"
  runtime: "python:3.11"
  handler: "model_handler:handler"

  env:
    - name: SAM_GPU_URL
      value: "http://10.0.0.26:9470"
    - name: SAM_MODEL_NAME
      value: "vit_h"

  build:
    baseImage: "python:3.11-slim"
    directives:
      preCopy:
        - kind: RUN
          value: "pip install requests"

  triggers:
    default-http:
      kind: "http"
      maxWorkers: 2
      attributes:
        maxRequestBodySize: 67108864

  platform:
    attributes:
      network: "cvat_cvat"
      restartPolicy:
        name: "always"
        maximumRetryCount: 3

  loggerLevel: "info"
  eventTimeout: "60s"
